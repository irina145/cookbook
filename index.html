<!DOCTYPE html>
<html lang="ru">
<head>
    <title>🍳 Кулинарная книга</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Playfair+Display:wght@400;500;600&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- EmailJS библиотека для отправки писем -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* ВАШ ИСХОДНЫЙ CSS СТИЛЬ - ОСТАВЛЯЕМ БЕЗ ИЗМЕНЕНИЙ */
        :root {
            --primary-green: #1a3c27;
            --secondary-green: #2d5a3b;
            --accent-green: #7cb342;
            --light-green: #e8f5e9;
            --lighter-green: #f5fff0;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #666666;
            --gray-dark: #333333;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.15);
            --danger: #ff6b6b;
            --danger-dark: #ff5252;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--white);
            font-family: 'Raleway', sans-serif;
            color: var(--gray-dark);
            line-height: 1.6;
        }
        
        /* HEADER */
        .site-header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--secondary-green) 100%);
            padding: 15px 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .logo h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: var(--white);
            font-weight: 700;
        }
        
        .logo-icon {
            font-size: 32px;
            color: var(--accent-green);
        }
        
        /* MAIN NAVIGATION */
        .main-nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .nav-item {
            position: relative;
            color: var(--light-green);
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            padding: 10px 0;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .nav-item:hover {
            color: var(--accent-green);
        }
        
        .nav-item.active {
            color: var(--accent-green);
        }
        
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-green);
        }
        
        /* USER ACTIONS */
        .user-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--white);
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--white);
        }
        
        .action-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.3s;
            position: relative;
        }
        
        .action-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .favorites-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--accent-green);
            color: var(--white);
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* MAIN CONTENT */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            min-height: calc(100vh - 150px);
        }
        
        /* AUTH FORMS */
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
        }
        
        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--primary-green);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-label {
            color: var(--secondary-green);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 2px rgba(124, 179, 66, 0.1);
        }
        
        .photo-preview-area {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .photo-preview {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--accent-green);
        }
        
        .photo-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: var(--light-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent-green);
            cursor: pointer;
            border: 2px dashed var(--accent-green);
        }
        
        .camera-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .camera-btn {
            padding: 10px 15px;
            background: var(--light-green);
            color: var(--secondary-green);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .auth-btn {
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        
        .auth-btn-danger {
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
        }
        
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: var(--gray);
            font-size: 14px;
        }
        
        .auth-link {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .auth-link:hover {
            text-decoration: underline;
        }
        
        /* PAGE HEADER */
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .page-description {
            color: var(--gray);
            font-size: 16px;
        }
        
        /* CATEGORIES GRID */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .category-card {
            background-color: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .category-icon {
            height: 120px;
            background: linear-gradient(135deg, var(--light-green), var(--lighter-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--secondary-green);
        }
        
        .category-content {
            padding: 20px;
        }
        
        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .category-count {
            color: var(--gray);
            font-size: 14px;
        }
        
        /* AUTHORS GRID */
        .authors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .author-card {
            background-color: var(--white);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .author-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .author-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--white);
            font-weight: bold;
        }
        
        .author-name {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary-green);
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .author-role {
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .author-stats {
            display: flex;
            justify-content: space-around;
            font-size: 12px;
            color: var(--gray);
        }
        
        /* RECIPES GRID */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .recipe-card {
            background-color: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .recipe-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .recipe-content {
            padding: 20px;
        }
        
        .recipe-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .action-buttons-group {
            display: flex;
            gap: 8px;
        }
        
        .share-btn, .download-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s;
            opacity: 0.7;
        }
        
        .share-btn:hover, .download-btn:hover {
            transform: scale(1.2);
            opacity: 1;
        }
        
        .share-btn {
            color: var(--accent-green);
        }
        
        .download-btn {
            color: var(--secondary-green);
        }
        
        .favorite-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #FFD700;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s;
        }
        
        .favorite-btn:hover {
            transform: scale(1.2);
        }
        
        .delete-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--danger);
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s;
            opacity: 0.7;
        }
        
        .delete-btn:hover {
            transform: scale(1.2);
            opacity: 1;
        }
        
        /* РЕЙТИНГ */
        .rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .stars {
            display: flex;
            gap: 2px;
        }
        
        .star {
            font-size: 18px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .star:hover {
            color: #FFD700;
        }
        
        .star.filled {
            color: #FFD700;
        }
        
        .rating-value {
            font-size: 14px;
            color: var(--gray);
            margin-left: 5px;
        }
        
        .recipe-meta {
            display: flex;
            justify-content: space-between;
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .recipe-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .recipe-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--gray);
        }
        
        .author-mini {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--white);
            font-weight: bold;
        }
        
        .recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .recipe-tag {
            background-color: var(--light-green);
            color: var(--secondary-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        /* ADD RECIPE BUTTON */
        .add-recipe-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            color: var(--white);
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow-hover);
            transition: all 0.3s;
            z-index: 100;
        }
        
        .add-recipe-btn:hover {
            transform: scale(1.1);
        }
        
        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--white);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-large {
            max-width: 900px;
        }
        
        .modal-header {
            padding: 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--primary-green);
            font-weight: 600;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 30px;
            color: var(--gray);
            cursor: pointer;
            padding: 5px;
        }
        
        .modal-content {
            padding: 25px;
        }
        
        /* PROFILE PAGE */
        .profile-header {
            background: linear-gradient(135deg, var(--light-green), var(--lighter-green));
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--white);
            font-weight: bold;
        }
        
        .profile-info {
            flex: 1;
        }
        
        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .profile-email {
            color: var(--gray);
            margin-bottom: 15px;
        }
        
        .profile-stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .profile-stat {
            text-align: center;
        }
        
        .stat-number {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: var(--secondary-green);
            font-weight: 600;
        }
        
        .stat-label {
            color: var(--gray);
            font-size: 14px;
        }
        
        /* ПОИСК ПО ИНГРЕДИЕНТАМ */
        .ingredients-search-container {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        
        .ingredients-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .ingredients-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-size: 16px;
            min-width: 200px;
        }
        
        .ingredients-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 2px rgba(124, 179, 66, 0.1);
        }
        
        .search-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .search-examples {
            color: var(--gray);
            font-size: 14px;
            margin-top: 10px;
        }
        
        .search-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        
        .search-tag {
            background: var(--light-green);
            color: var(--secondary-green);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        
        .search-tag:hover {
            background: var(--accent-green);
            color: white;
        }
        
        /* CONFIRM MODAL */
        .confirm-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .confirm-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        
        .confirm-btn-yes {
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
            color: white;
        }
        
        .confirm-btn-no {
            background: var(--light-green);
            color: var(--secondary-green);
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                text-align: center;
            }
            
            .main-nav {
                gap: 15px;
                overflow-x: auto;
                padding-bottom: 10px;
                width: 100%;
                justify-content: center;
            }
            
            .user-actions {
                width: 100%;
                justify-content: center;
            }
            
            .categories-grid,
            .authors-grid,
            .recipes-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }
            
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            
            .profile-stats {
                justify-content: center;
            }
            
            .recipe-meta {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo" onclick="navigateTo('home')">
                <span class="logo-icon">🍳</span>
                <h1>Кулинарная книга</h1>
            </div>
            
            <nav class="main-nav">
                <button class="nav-item active" onclick="navigateTo('home')">🏠 Главная</button>
                <button class="nav-item" onclick="navigateTo('categories')">📚 Категории</button>
                <button class="nav-item" onclick="navigateTo('my-recipes')">📝 Мои рецепты</button>
                <button class="nav-item" onclick="navigateTo('favorites')">⭐ Избранное</button>
                <button class="nav-item" onclick="navigateTo('profile')">👤 Профиль</button>
            </nav>
            
            <div class="user-actions" id="user-actions"></div>
        </div>
    </header>
    
    <!-- MAIN CONTENT -->

    <script>
        // ========== ИНИЦИАЛИЗАЦИЯ EMAILJS ==========
        const EMAILJS_CONFIG = {
            PUBLIC_KEY: 'YOUR_PUBLIC_KEY',
            SERVICE_ID: 'YOUR_SERVICE_ID',
            TEMPLATE_ID: 'YOUR_TEMPLATE_ID'
        };
        
        emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);
        
        async function sendRegistrationEmail(user) {
            try {
                const templateParams = {
                    to_email: user.email,
                    to_name: user.name,
                    message: `Добро пожаловать в Кулинарную книгу! Мы рады видеть вас в нашем сообществе.`,
                    registration_date: new Date().toLocaleString('ru-RU'),
                    site_name: 'Кулинарная книга'
                };
                await emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID, templateParams);
                return true;
            } catch (error) {
                console.error('Ошибка отправки email:', error);
                return false;
            }
        }
        
        // ========== ОБЛАЧНАЯ БАЗА ==========
        const API_URL = 'https://script.google.com/macros/s/AKfycbyXKWE-zrjvFWrZiAYx8I-ZEToKWH8mx8g0T1QD8WNhpUMSOLUHb8yhycTpM-VEVQqaZA/exec';
        
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        let currentPage = 'home';
        let currentSearchQuery = '';
        let recipeToDelete = null;
        let currentRecipeForActions = null;
        let selectedPhotoBase64 = null;
        
        // ========== РАБОТА С ФОТО ==========
        function openCamera() {
            const input = document.getElementById('photo-file-input');
            input.setAttribute('capture', 'environment');
            input.click();
        }
        
        function uploadFromGallery() {
            const input = document.getElementById('photo-file-input');
            input.removeAttribute('capture');
            input.click();
        }
        
        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedPhotoBase64 = e.target.result;
                updatePhotoPreview(selectedPhotoBase64);
                document.getElementById('recipe-image').value = selectedPhotoBase64;
            };
            reader.readAsDataURL(file);
        }
        
        function updatePhotoPreview(imageUrl) {
            const previewArea = document.getElementById('photo-preview-area');
            previewArea.innerHTML = `
                <img src="${imageUrl}" class="photo-preview" onclick="uploadFromGallery()">
                <div class="photo-placeholder" style="width: 40px; height: 40px; font-size: 16px;" onclick="uploadFromGallery()">✖</div>
            `;
        }
        
        // ========== СКАЧИВАНИЕ РЕЦЕПТА ==========
        function downloadRecipe(recipe) {
            const content = generateRecipeText(recipe);
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `${recipe.title.replace(/[^а-яА-Яa-zA-Z0-9]/g, '_')}_рецепт.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showNotification('Рецепт скачан!');
        }
        
        function downloadCurrentRecipe() {
            if (currentRecipeForActions) {
                downloadRecipe(currentRecipeForActions);
            }
        }
        
        // ========== ПОЛУЧЕНИЕ РЕЦЕПТА В ТЕКСТОВОМ ФОРМАТЕ ==========
        function generateRecipeText(recipe) {
            return `
╔══════════════════════════════════════════════════════════════╗
║                    🍳 РЕЦЕПТ: ${recipe.title}                    ║
╚══════════════════════════════════════════════════════════════╝

📋 ОСНОВНАЯ ИНФОРМАЦИЯ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📁 Категория:      ${recipe.category || 'Не указана'}
⏱️ Время:          ${recipe.total_time || 0} минут
👥 Порции:         ${recipe.servings || 1}
📊 Сложность:      ${recipe.difficulty || 'Средняя'}
🔥 Калорийность:   ${recipe.calorie_count || 'Не указано'} ккал
⭐ Рейтинг:        ${(recipe.rating || 5).toFixed(1)} (${recipe.ratings_count || 0} оценок)
👨‍🍳 Автор:         ${recipe.author_name || 'Аноним'}

🛒 ИНГРЕДИЕНТЫ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${(recipe.ingredients || []).map((ing, i) => `   ${i+1}. ${ing}`).join('\n')}

👩‍🍳 ПРИГОТОВЛЕНИЕ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${(recipe.steps || []).map((step, i) => `   ${i+1}. ${step}`).join('\n\n')}

🏷️ ТЕГИ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${(recipe.tags || []).join(', ') || 'Нет тегов'}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📅 Скачано с Кулинарной книги
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            `;
        }
        
        // ========== ПОЛУЧЕНИЕ РЕЦЕПТА ДЛЯ ПУБЛИКАЦИИ ==========
        function generateShareText(recipe) {
            return `🍳 *${recipe.title}*

📋 Категория: ${recipe.category || 'Не указана'}
⏱️ Время приготовления: ${recipe.total_time || 0} минут
👥 Порций: ${recipe.servings || 1}
🔥 Калорийность: ${recipe.calorie_count || 'Не указано'} ккал

🛒 Ингредиенты:
${(recipe.ingredients || []).map(ing => `• ${ing}`).join('\n')}

👩‍🍳 Приготовление:
${(recipe.steps || []).map((step, i) => `${i+1}. ${step}`).join('\n')}

⭐ Рейтинг: ${(recipe.rating || 5).toFixed(1)}/5

#рецепт #кулинария #${recipe.category?.toLowerCase() || 'еда'}`;
        }
        
        // ========== ПОБЛОЧНАЯ ФУНКЦИЯ ==========
        async function shareRecipe(recipe) {
            const shareText = generateShareText(recipe);
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: recipe.title,
                        text: shareText,
                        url: window.location.href
                    });
                    showNotification('Поделились!');
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        copyToClipboard(shareText);
                    }
                }
            } else {
                copyToClipboard(shareText);
            }
        }
        
        function shareCurrentRecipe() {
            if (currentRecipeForActions) {
                shareRecipe(currentRecipeForActions);
            }
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Рецепт скопирован в буфер обмена!');
            }).catch(() => {
                showNotification('Не удалось скопировать', 'error');
            });
        }
        
        // ========== ОБЛАЧНАЯ БД ==========
        const CloudDB = {
            async testConnection() {
                try {
                    const response = await fetch(`${API_URL}?action=test`);
                    const data = await response.json();
                    return data.status === 'ok';
                } catch (error) {
                    console.warn('Не удалось подключиться к облаку');
                    return false;
                }
            },
            
            async register(user) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'register', ...user })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            
            async login(email, password) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'login', email, password })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            
            async getRecipes() {
                try {
                    const response = await fetch(`${API_URL}?action=getRecipes`);
                    const data = await response.json();
                    return data.recipes || [];
                } catch (error) {
                    console.error('Ошибка получения рецептов:', error);
                    return [];
                }
            },
            
            async addRecipe(recipe) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'addRecipe', ...recipe })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            
            async deleteRecipe(recipeId) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'deleteRecipe', recipeId })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            
            async getRecipe(id) {
                try {
                    const response = await fetch(`${API_URL}?action=getRecipe&id=${id}`);
                    const data = await response.json();
                    return data.recipe || null;
                } catch (error) {
                    return null;
                }
            },
            
            async rateRecipe(recipeId, userId, rating) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'rateRecipe', recipeId, userId, rating })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            
            async toggleFavorite(userId, recipeId) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'toggleFavorite', userId, recipeId })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            
            async getFavorites(userId) {
                try {
                    const response = await fetch(`${API_URL}?action=getFavorites&userId=${userId}`);
                    const data = await response.json();
                    return data.favorites || [];
                } catch (error) {
                    return [];
                }
            }
        };
        
        // ========== ЛОКАЛЬНЫЙ КЭШ ==========
        const LocalCache = {
            getRecipes() {
                return JSON.parse(localStorage.getItem('recipes_cache') || '[]');
            },
            getFavorites(userId) {
                const favorites = JSON.parse(localStorage.getItem('favorites_cache') || '{}');
                return favorites[userId] || [];
            },
            saveRecipes(recipes) {
                localStorage.setItem('recipes_cache', JSON.stringify(recipes));
            },
            saveFavorites(userId, favoriteIds) {
                const favorites = JSON.parse(localStorage.getItem('favorites_cache') || '{}');
                favorites[userId] = favoriteIds;
                localStorage.setItem('favorites_cache', JSON.stringify(favorites));
            },
            deleteRecipe(recipeId) {
                const recipes = this.getRecipes();
                const updatedRecipes = recipes.filter(r => r.id != recipeId);
                this.saveRecipes(updatedRecipes);
                
                const favorites = JSON.parse(localStorage.getItem('favorites_cache') || '{}');
                Object.keys(favorites).forEach(userId => {
                    favorites[userId] = favorites[userId].filter(id => id != recipeId);
                });
                localStorage.setItem('favorites_cache', JSON.stringify(favorites));
                return true;
            },
            searchByQuery(query, recipes) {
                if (!query) return recipes;
                const searchTerms = query.toLowerCase().split(/[,\s]+/).filter(t => t.length > 0);
                return recipes.filter(recipe => {
                    const titleLower = recipe.title.toLowerCase();
                    const ingredientsText = (recipe.ingredients || []).join(' ').toLowerCase();
                    const tagsText = (recipe.tags || []).join(' ').toLowerCase();
                    const categoryLower = (recipe.category || '').toLowerCase();
                    return searchTerms.some(term => 
                        titleLower.includes(term) || ingredientsText.includes(term) || 
                        tagsText.includes(term) || categoryLower.includes(term)
                    );
                });
            }
        };
        
        // ========== МЕНЕДЖЕР ДАННЫХ ==========
        const DB = {
            useCloud: false,
            
            async init() {
                this.useCloud = await CloudDB.testConnection();
                if (this.useCloud) {
                    try {
                        const recipes = await CloudDB.getRecipes();
                        LocalCache.saveRecipes(recipes);
                    } catch (error) {
                        console.error('Ошибка загрузки рецептов:', error);
                    }
                }
                return this.useCloud;
            },
            
            async register(user) {
                if (this.useCloud) return await CloudDB.register(user);
                const users = JSON.parse(localStorage.getItem('users_cache') || '[]');
                const existingUser = users.find(u => u.email === user.email);
                if (existingUser) return { success: false, message: 'Пользователь уже существует' };
                const newUser = { ...user, id: Date.now(), created_at: new Date().toISOString() };
                users.push(newUser);
                localStorage.setItem('users_cache', JSON.stringify(users));
                return { success: true, user: newUser };
            },
            
            async login(email, password) {
                if (this.useCloud) return await CloudDB.login(email, password);
                const users = JSON.parse(localStorage.getItem('users_cache') || '[]');
                const user = users.find(u => u.email === email && u.password === password);
                if (user) return { success: true, user };
                if (email === 'demo@example.com' && password === 'demo123') {
                    return { success: true, user: { id: 1, email: 'demo@example.com', name: 'Демо Пользователь', avatar: 'Д' } };
                }
                return { success: false, message: 'Неверные данные' };
            },
            
            async getRecipes() {
                if (this.useCloud) {
                    const cloudRecipes = await CloudDB.getRecipes();
                    if (cloudRecipes.length > 0) {
                        LocalCache.saveRecipes(cloudRecipes);
                        return cloudRecipes;
                    }
                }
                const cachedRecipes = LocalCache.getRecipes();
                if (cachedRecipes.length > 0) return cachedRecipes;
                
                const demoRecipes = [
                    {
                        id: 1,
                        title: "Борщ классический",
                        description: "Традиционный украинский борщ со свеклой и говядиной",
                        category: "Супы",
                        total_time: 120,
                        difficulty: "Средняя",
                        servings: 6,
                        calorie_count: 350,
                        rating: 4.8,
                        ratings_count: 24,
                        author_id: 1,
                        author_name: "Демо Пользователь",
                        image_url: "https://images.unsplash.com/photo-1547592180-85f173990554?w=800",
                        ingredients: ["500 г говядины", "2 шт свеклы", "3 картофелины", "1 морковь", "1 луковица", "200 г капусты"],
                        steps: ["Варить мясо 1.5 часа", "Нарезать овощи", "Добавить овощи в бульон", "Варить 30 минут", "Подавать со сметаной"],
                        tags: ["русская кухня", "мясо", "суп"]
                    },
                    {
                        id: 2,
                        title: "Омлет с овощами",
                        description: "Пышный омлет с болгарским перцем и помидорами",
                        category: "Завтраки",
                        total_time: 25,
                        difficulty: "Легкая",
                        servings: 2,
                        calorie_count: 250,
                        rating: 4.5,
                        ratings_count: 18,
                        author_id: 1,
                        author_name: "Демо Пользователь",
                        image_url: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800",
                        ingredients: ["4 яйца", "50 мл молока", "1 помидор", "1 болгарский перец", "соль", "перец", "зелень"],
                        steps: ["Взбить яйца с молоком", "Нарезать овощи", "Обжарить овощи", "Залить яйцами", "Готовить 10 минут"],
                        tags: ["завтрак", "быстро", "просто"]
                    }
                ];
                LocalCache.saveRecipes(demoRecipes);
                return demoRecipes;
            },
            
            async addRecipe(recipe) {
                if (this.useCloud) {
                    const result = await CloudDB.addRecipe(recipe);
                    if (result.success) {
                        const recipes = await this.getRecipes();
                        const newRecipe = { ...recipe, id: result.id, rating: 5.0, ratings_count: 1, created_at: new Date().toISOString() };
                        recipes.push(newRecipe);
                        LocalCache.saveRecipes(recipes);
                    }
                    return result;
                } else {
                    const recipes = LocalCache.getRecipes();
                    const newRecipe = { ...recipe, id: Date.now(), rating: 5.0, ratings_count: 1, created_at: new Date().toISOString() };
                    recipes.push(newRecipe);
                    LocalCache.saveRecipes(recipes);
                    return { success: true, id: newRecipe.id };
                }
            },
            
            async deleteRecipe(recipeId) {
                if (this.useCloud) {
                    const result = await CloudDB.deleteRecipe(recipeId);
                    if (result.success) LocalCache.deleteRecipe(recipeId);
                    return result;
                } else {
                    LocalCache.deleteRecipe(recipeId);
                    return { success: true };
                }
            },
            
            async getRecipe(id) {
                const recipes = await this.getRecipes();
                return recipes.find(r => r.id == id) || null;
            },
            
            async rateRecipe(recipeId, userId, rating) {
                if (this.useCloud) {
                    const result = await CloudDB.rateRecipe(recipeId, userId, rating);
                    if (result.success) {
                        const recipes = await this.getRecipes();
                        const recipeIndex = recipes.findIndex(r => r.id == recipeId);
                        if (recipeIndex !== -1) {
                            const currentRating = recipes[recipeIndex].rating || 5;
                            const currentCount = recipes[recipeIndex].ratings_count || 1;
                            recipes[recipeIndex].rating = ((currentRating * currentCount) + rating) / (currentCount + 1);
                            recipes[recipeIndex].ratings_count = currentCount + 1;
                            LocalCache.saveRecipes(recipes);
                        }
                    }
                    return result;
                } else {
                    const recipes = LocalCache.getRecipes();
                    const recipeIndex = recipes.findIndex(r => r.id == recipeId);
                    if (recipeIndex !== -1) {
                        const currentRating = recipes[recipeIndex].rating || 5;
                        const currentCount = recipes[recipeIndex].ratings_count || 1;
                        recipes[recipeIndex].rating = ((currentRating * currentCount) + rating) / (currentCount + 1);
                        recipes[recipeIndex].ratings_count = currentCount + 1;
                        LocalCache.saveRecipes(recipes);
                    }
                    return { success: true };
                }
            },
            
            async toggleFavorite(userId, recipeId) {
                if (this.useCloud) {
                    const result = await CloudDB.toggleFavorite(userId, recipeId);
                    if (result.success) this.updateLocalFavorites(userId, recipeId, result.added);
                    return result;
                } else {
                    const added = this.updateLocalFavorites(userId, recipeId);
                    return { success: true, added };
                }
            },
            
            updateLocalFavorites(userId, recipeId, shouldAdd = null) {
                const favorites = LocalCache.getFavorites(userId);
                const index = favorites.indexOf(recipeId);
                let added = false;
                if (shouldAdd !== null) {
                    added = shouldAdd;
                    if (shouldAdd && index === -1) favorites.push(recipeId);
                    else if (!shouldAdd && index !== -1) favorites.splice(index, 1);
                } else {
                    if (index === -1) { favorites.push(recipeId); added = true; }
                    else { favorites.splice(index, 1); added = false; }
                }
                LocalCache.saveFavorites(userId, favorites);
                return added;
            },
            
            async getFavorites(userId) {
                if (this.useCloud) return await CloudDB.getFavorites(userId);
                else return LocalCache.getFavorites(userId);
            },
            
            searchByQuery(query) {
                const recipes = LocalCache.getRecipes();
                return LocalCache.searchByQuery(query, recipes);
            }
        };

        function addIngredientToSearch(ingredient) {
            const input = document.getElementById('universal-search');

        }
        
        async function performUniversalSearch() {
            const input = document.getElementById('universal-search');
            let query = input.value.trim();
            if (!query) { clearSearch(); return; }
            currentSearchQuery = query;
            
            const results = DB.searchByQuery(query);
            const resultsSection = document.getElementById('search-results-section');
            
            if (!resultsSection) return;
            
            if (results.length === 0) {
                resultsSection.innerHTML = `<div style="background: var(--light-green); padding: 25px; border-radius: 12px;"><h3>🔍 Результаты поиска "${query}"</h3><p>Ничего не найдено. Попробуйте изменить запрос.</p><button onclick="clearSearch()" style="padding: 10px 20px; background: var(--accent-green); color: white; border: none; border-radius: 8px;">Очистить</button></div>`;
            } else {
                resultsSection.innerHTML = `<div style="background: var(--light-green); padding: 25px; border-radius: 12px;"><h3>🔍 Результаты поиска "${query}"</h3><p>Найдено рецептов: ${results.length}</p><div class="recipes-grid">${(await Promise.all(results.map(recipe => renderRecipeCard(recipe)))).join('')}</div></div>`;
            }
        }

            currentSearchQuery = '';

            if (input) input.value = '';
            const resultsSection = document.getElementById('search-results-section');
            if (resultsSection) resultsSection.innerHTML = '';
        }

                    <div style="flex: 1; min-width: 300px;"><img src="${recipe.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'}" style="width: 100%; border-radius: 12px; height: 300px; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'"></div>

                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px;">
                            <div style="padding: 10px; background: var(--light-green); border-radius: 8px;"><div style="font-weight: bold;">${recipe.total_time || 0} мин</div><div style="font-size: 12px;">Время готовки</div></div>
                            <div style="padding: 10px; background: var(--light-green); border-radius: 8px;"><div style="font-weight: bold;">${recipe.servings || 1} порции</div><div style="font-size: 12px;">Количество</div></div>
                            <div style="padding: 10px; background: var(--light-green); border-radius: 8px;"><div style="font-weight: bold;">${recipe.difficulty || 'Средняя'}</div><div style="font-size: 12px;">Сложность</div></div>
                            ${recipe.calorie_count ? `<div style="padding: 10px; background: var(--light-green); border-radius: 8px;"><div style="font-weight: bold;">${recipe.calorie_count} ккал</div><div style="font-size: 12px;">Калорийность</div></div>` : ''}
                        </div>
                        <div style="margin-bottom: 20px;">
                            <div class="rating"><div class="stars">${[1,2,3,4,5].map(star => `<span class="star ${star <= Math.round(recipe.rating || 5) ? 'filled' : ''}" onclick="rateRecipe(${recipe.id}, ${star})">★</span>`).join('')}</div><span class="rating-value">${(recipe.rating || 5).toFixed(1)} (${recipe.ratings_count || 0} оценок)</span></div>
                        </div>
                        <div class="recipe-tags" style="margin-bottom: 20px;">${(recipe.tags || []).map(tag => `<span class="recipe-tag">${tag}</span>`).join('')}</div>
                        ${currentUser ? `<div style="display: flex; gap: 10px; flex-wrap: wrap;"><button onclick="toggleFavoriteRecipe(${recipe.id})" style="padding: 10px 20px; background: ${isFavorite ? 'var(--light-green)' : 'linear-gradient(135deg, var(--accent-green), var(--secondary-green))'}; color: ${isFavorite ? 'var(--secondary-green)' : 'white'}; border: none; border-radius: 8px;">${isFavorite ? '★ В избранном' : '☆ Добавить в избранное'}</button>${isAuthor ? `<button onclick="showDeleteConfirm(${recipe.id})" style="padding: 10px 20px; background: var(--danger); color: white; border: none; border-radius: 8px;">🗑️ Удалить</button>` : ''}</div>` : ''}
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; flex-wrap: wrap;">
                    <div><h3 style="font-family: 'Playfair Display', serif; color: var(--primary-green); margin-bottom: 15px;">🧺 Ингредиенты</h3><ul style="list-style: none;">${(recipe.ingredients || []).map(ing => `<li style="padding: 8px 0; border-bottom: 1px solid #eee;">🌿 ${ing}</li>`).join('')}</ul></div>
                    <div><h3 style="font-family: 'Playfair Display', serif; color: var(--primary-green); margin-bottom: 15px;">👩‍🍳 Приготовление</h3><ol>${(recipe.steps || []).map((step, i) => `<li style="padding: 10px 0; border-bottom: 1px solid #f0f0f0;"><strong>Шаг ${i+1}:</strong> ${step}</li>`).join('')}</ol></div>
                </div>
            `;
            document.getElementById('recipe-modal').classList.add('active');
        }
        
        // ========== ОСТАЛЬНЫЕ ФУНКЦИИ ==========
        async function rateRecipe(recipeId, rating, event) {
            if (event) event.stopPropagation();
            if (!currentUser) { showAuthModal('login'); return; }
            await DB.rateRecipe(recipeId, currentUser.id, rating);
            showNotification(`Оценено на ${rating} звезд!`);
            await navigateTo(currentPage);
        }
        
        async function toggleFavoriteRecipe(recipeId, event) {
            if (event) event.stopPropagation();
            if (!currentUser) { showAuthModal('login'); return; }
            const result = await DB.toggleFavorite(currentUser.id, recipeId);
            showNotification(result.added ? 'Добавлено в избранное' : 'Удалено из избранного');
            await navigateTo(currentPage);
            await updateUserInterface();
        }
        
        function showDeleteConfirm(recipeId) {
            recipeToDelete = recipeId;
            document.getElementById('confirm-delete-modal').classList.add('active');
        }
        
        function closeConfirmDeleteModal() {
            document.getElementById('confirm-delete-modal').classList.remove('active');
            recipeToDelete = null;
        }
        
        async function confirmDeleteRecipe() {
            if (!recipeToDelete) return;
            await DB.deleteRecipe(recipeToDelete);
            showNotification('Рецепт удален');
            closeConfirmDeleteModal();
            await navigateTo(currentPage);
        }
        
        function closeRecipeModal() {
            document.getElementById('recipe-modal').classList.remove('active');
            currentRecipeForActions = null;
        }
        
        function showAuthModal(type) {
            const modal = document.getElementById('auth-modal');
            const title = document.getElementById('auth-modal-title');
            const formContainer = document.getElementById('auth-form-container');
            title.textContent = type === 'login' ? 'Вход' : 'Регистрация';
            formContainer.innerHTML = `
                <form id="${type}-form" class="auth-form">
                    ${type === 'register' ? `<div class="form-group"><label class="form-label">Имя</label><input type="text" class="form-input" id="register-name" required></div>` : ''}
                    <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="${type}-email" required></div>
                    <div class="form-group"><label class="form-label">Пароль</label><input type="password" class="form-input" id="${type}-password" required minlength="6"></div>
                    <button type="submit" class="auth-btn">${type === 'login' ? 'Войти' : 'Зарегистрироваться'}</button>
                </form>
                <div class="auth-switch">${type === 'login' ? 'Нет аккаунта? <a class="auth-link" onclick="showAuthModal(\'register\')">Зарегистрироваться</a>' : 'Уже есть аккаунт? <a class="auth-link" onclick="showAuthModal(\'login\')">Войти</a>'}</div>
            `;
            document.getElementById(`${type}-form`).addEventListener('submit', async (e) => { e.preventDefault(); type === 'login' ? await login() : await register(); });
            modal.classList.add('active');
        }
        
        function closeAuthModal() { document.getElementById('auth-modal').classList.remove('active'); }
        
        async function register() {
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const result = await DB.register({ email, name, password, avatar: name.charAt(0).toUpperCase() });
            if (result.success) {
                currentUser = result.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                await sendRegistrationEmail(currentUser);
                closeAuthModal();
                await updateUserInterface();
                await navigateTo('home');
                showNotification(`Добро пожаловать, ${name}!`);
            } else showNotification(result.message || 'Ошибка регистрации', 'error');
        }
        
        async function login() {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const result = await DB.login(email, password);
            if (result.success) {
                currentUser = result.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                closeAuthModal();
                await updateUserInterface();
                await navigateTo('home');
                showNotification(`С возвращением, ${currentUser.name}!`);
            } else showNotification(result.message || 'Неверный email или пароль', 'error');
        }
        
        async function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            await updateUserInterface();
            await navigateTo('home');
            showNotification('Вы вышли из системы');
        }
        
        function showAddRecipeModal() {
            if (!currentUser) { showAuthModal('login'); return; }
            selectedPhotoBase64 = null;
            document.getElementById('photo-preview-area').innerHTML = '<div class="photo-placeholder" onclick="uploadFromGallery()">+</div>';
            document.getElementById('recipe-image').value = '';
            document.getElementById('add-recipe-modal').classList.add('active');
        }
        
        function closeAddRecipeModal() {
            document.getElementById('add-recipe-modal').classList.remove('active');
            document.getElementById('recipe-form').reset();
            selectedPhotoBase64 = null;
        }
        
        async function addRecipe() {
            if (!currentUser) { showAuthModal('login'); return; }
            const title = document.getElementById('recipe-title').value.trim();
            const category = document.getElementById('recipe-category').value;
            const time = parseInt(document.getElementById('recipe-time').value);
            const servings = parseInt(document.getElementById('recipe-servings').value);
            const difficulty = document.getElementById('recipe-difficulty').value;
            const calorie_count = parseInt(document.getElementById('recipe-calorie_count').value);
            const ingredients = document.getElementById('recipe-ingredients').value.split('\n').filter(i => i.trim());
            const steps = document.getElementById('recipe-steps').value.split('\n').filter(s => s.trim());
            const tags = document.getElementById('recipe-tags').value.split(',').map(t => t.trim()).filter(t => t);
            const image = selectedPhotoBase64 || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800';
            
            const recipe = { title, description: `Вкусный рецепт "${title}"`, category, total_time: time, difficulty, servings, calorie_count, rating: 5.0, ratings_count: 1, views: 0, author_id: currentUser.id, author_name: currentUser.name, image_url: image, ingredients, steps, tags: tags.length > 0 ? tags : [category, difficulty] };
            
            const result = await DB.addRecipe(recipe);
            if (result.success) {
                await DB.rateRecipe(result.id || recipe.id, currentUser.id, 5);
                closeAddRecipeModal();
                await showRecipeDetail(result.id || recipe.id);
                showNotification('Рецепт успешно добавлен!');
                await navigateTo(currentPage);
            } else showNotification('Ошибка добавления рецепта', 'error');
        }
        
        function getCategoryIcon(categoryName) {
            const icons = { 'Супы': '🥣', 'Основные блюда': '🍛', 'Салаты': '🥗', 'Десерты': '🍰', 'Выпечка': '🥐', 'Закуски': '🍤', 'Напитки': '🥤', 'Завтраки': '🍳' };
            return icons[categoryName] || '✨';
        }
        
        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.cssText = `position: fixed; bottom: 20px; right: 20px; background: ${type === 'error' ? '#ff6b6b' : 'var(--accent-green)'}; color: white; padding: 15px 25px; border-radius: 8px; box-shadow: var(--shadow-hover); z-index: 10001; font-family: 'Raleway', sans-serif; animation: slideIn 0.3s ease;`;
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => { notification.style.animation = 'slideOut 0.3s ease'; setTimeout(() => document.body.removeChild(notification), 300); }, 3000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(modal => modal.classList.remove('active')); });
            init();
        });
    </script>
</body>
</html>
