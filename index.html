<!DOCTYPE html>
<html lang="ru">
<head>
    <title>🍳 Кулинарная книга - Админ-панель</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Playfair+Display:wght@400;500;600&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary-green: #1a3c27;
            --secondary-green: #2d5a3b;
            --accent-green: #7cb342;
            --light-green: #e8f5e9;
            --lighter-green: #f5fff0;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #666666;
            --gray-dark: #333333;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.15);
            --danger: #ff6b6b;
            --danger-dark: #ff5252;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--white);
            font-family: 'Raleway', sans-serif;
            color: var(--gray-dark);
            line-height: 1.6;
        }
        
        .site-header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--secondary-green) 100%);
            padding: 15px 0;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        
        .logo h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: var(--white);
            font-weight: 700;
        }
        
        .logo-icon {
            font-size: 32px;
            color: var(--accent-green);
        }
        
        .main-nav {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .nav-item {
            position: relative;
            color: var(--light-green);
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            padding: 10px 0;
            transition: color 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        .nav-item:hover {
            color: var(--accent-green);
        }
        
        .nav-item.active {
            color: var(--accent-green);
        }
        
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-green);
        }
        
        .user-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--white);
        }
        
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--white);
        }
        
        .action-btn {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 18px;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.3s;
            position: relative;
        }
        
        .action-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .favorites-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--accent-green);
            color: var(--white);
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
            min-height: calc(100vh - 150px);
        }
        
        .auth-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
        }
        
        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--primary-green);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .form-label {
            color: var(--secondary-green);
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-input {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 2px rgba(124, 179, 66, 0.1);
        }
        
        .photo-preview-area {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .photo-preview {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--accent-green);
        }
        
        .photo-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: var(--light-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent-green);
            cursor: pointer;
            border: 2px dashed var(--accent-green);
        }
        
        .camera-options {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        
        .camera-btn {
            padding: 10px 15px;
            background: var(--light-green);
            color: var(--secondary-green);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .auth-btn {
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        
        .auth-btn-danger {
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
        }
        
        .auth-switch {
            text-align: center;
            margin-top: 20px;
            color: var(--gray);
            font-size: 14px;
        }
        
        .auth-link {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .page-header {
            margin-bottom: 30px;
        }
        
        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .page-description {
            color: var(--gray);
            font-size: 16px;
        }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .category-card {
            background-color: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .category-icon {
            height: 120px;
            background: linear-gradient(135deg, var(--light-green), var(--lighter-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--secondary-green);
        }
        
        .category-content {
            padding: 20px;
        }
        
        .category-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .category-count {
            color: var(--gray);
            font-size: 14px;
        }
        
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }
        
        .recipe-card {
            background-color: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        
        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }
        
        .recipe-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .recipe-content {
            padding: 20px;
        }
        
        .recipe-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        .action-buttons-group {
            display: flex;
            gap: 8px;
        }
        
        .share-btn, .download-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s;
            opacity: 0.7;
        }
        
        .share-btn:hover, .download-btn:hover {
            transform: scale(1.2);
            opacity: 1;
        }
        
        .share-btn { color: var(--accent-green); }
        .download-btn { color: var(--secondary-green); }
        
        .favorite-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #FFD700;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s;
        }
        
        .favorite-btn:hover { transform: scale(1.2); }
        
        .delete-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--danger);
            cursor: pointer;
            padding: 5px;
            transition: transform 0.3s;
            opacity: 0.7;
        }
        
        .delete-btn:hover { transform: scale(1.2); opacity: 1; }
        
        .rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }
        
        .stars {
            display: flex;
            gap: 2px;
        }
        
        .star {
            font-size: 18px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .star:hover { color: #FFD700; }
        .star.filled { color: #FFD700; }
        
        .rating-value {
            font-size: 14px;
            color: var(--gray);
            margin-left: 5px;
        }
        
        .recipe-meta {
            display: flex;
            justify-content: space-between;
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .recipe-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .recipe-author {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--gray);
        }
        
        .author-mini {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--white);
            font-weight: bold;
        }
        
        .recipe-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        
        .recipe-tag {
            background-color: var(--light-green);
            color: var(--secondary-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .add-recipe-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            color: var(--white);
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: var(--shadow-hover);
            transition: all 0.3s;
            z-index: 100;
        }
        
        .add-recipe-btn:hover { transform: scale(1.1); }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: var(--white);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-large { max-width: 900px; }
        
        .modal-header {
            padding: 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--primary-green);
            font-weight: 600;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 30px;
            color: var(--gray);
            cursor: pointer;
            padding: 5px;
        }
        
        .modal-content { padding: 25px; }
        
        .profile-header {
            background: linear-gradient(135deg, var(--light-green), var(--lighter-green));
            padding: 40px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: var(--white);
            font-weight: bold;
        }
        
        .profile-info { flex: 1; }
        
        .profile-name {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .profile-email {
            color: var(--gray);
            margin-bottom: 15px;
        }
        
        .profile-stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        
        .profile-stat { text-align: center; }
        
        .stat-number {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: var(--secondary-green);
            font-weight: 600;
        }
        
        .stat-label {
            color: var(--gray);
            font-size: 14px;
        }
        
        .ingredients-search-container {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        
        .ingredients-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .ingredients-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-size: 16px;
            min-width: 200px;
        }
        
        .search-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, var(--accent-green), var(--secondary-green));
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .search-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }
        
        .search-tag {
            background: var(--light-green);
            color: var(--secondary-green);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }
        
        .search-tag:hover {
            background: var(--accent-green);
            color: white;
        }
        
        .confirm-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .confirm-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Raleway', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .confirm-btn-yes {
            background: linear-gradient(135deg, var(--danger), var(--danger-dark));
            color: white;
        }
        
        .confirm-btn-no {
            background: var(--light-green);
            color: var(--secondary-green);
        }
        
        .admin-badge {
            background: #ff9800;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            .header-container { flex-direction: column; text-align: center; }
            .main-nav { gap: 15px; overflow-x: auto; width: 100%; justify-content: center; }
            .user-actions { width: 100%; justify-content: center; }
            .categories-grid, .recipes-grid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
            .profile-header { flex-direction: column; text-align: center; }
            .profile-stats { justify-content: center; }
        }
        
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(100%); opacity: 0; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo" onclick="navigateTo('home')">
                <span class="logo-icon">🍳</span>
                <h1>Кулинарная книга</h1>
            </div>
            
            <nav class="main-nav">
                <button class="nav-item active" onclick="navigateTo('home')">🏠 Главная</button>
                <button class="nav-item" onclick="navigateTo('categories')">📚 Категории</button>
                <button class="nav-item" onclick="navigateTo('my-recipes')">📝 Мои рецепты</button>
                <button class="nav-item" onclick="navigateTo('favorites')">⭐ Избранное</button>
                <button class="nav-item" onclick="navigateTo('profile')">👤 Профиль</button>
            </nav>
            
            <div class="user-actions" id="user-actions"></div>
        </div>
    </header>
    
    <div class="main-container" id="main-content"></div>
    
    <button class="add-recipe-btn" onclick="showAddRecipeModal()" style="display: none;" id="add-recipe-btn">+</button>
    
    <!-- Модальное окно авторизации -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="auth-modal-title">Вход</h2>
                <button class="modal-close" onclick="closeAuthModal()">×</button>
            </div>
            <div class="modal-content">
                <div id="auth-form-container"></div>
            </div>
        </div>
    </div>
    
    <!-- Модальное окно добавления рецепта -->
    <div class="modal-overlay" id="add-recipe-modal">
        <div class="modal modal-large">
            <div class="modal-header">
                <h2 class="modal-title">Добавить рецепт</h2>
                <button class="modal-close" onclick="closeAddRecipeModal()">×</button>
            </div>
            <div class="modal-content">
                <form id="recipe-form" class="auth-form">
                    <div class="form-group">
                        <label class="form-label">Название рецепта</label>
                        <input type="text" class="form-input" id="recipe-title" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Категория</label>
                        <select class="form-input" id="recipe-category" required>
                            <option value="">Выберите категорию</option>
                            <option value="Супы">Супы</option>
                            <option value="Основные блюда">Основные блюда</option>
                            <option value="Салаты">Салаты</option>
                            <option value="Десерты">Десерты</option>
                            <option value="Выпечка">Выпечка</option>
                            <option value="Закуски">Закуски</option>
                            <option value="Напитки">Напитки</option>
                            <option value="Завтраки">Завтраки</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Время приготовления (минут)</label>
                        <input type="number" class="form-input" id="recipe-time" min="5" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Количество порций</label>
                        <input type="number" class="form-input" id="recipe-servings" min="1" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Сложность</label>
                        <select class="form-input" id="recipe-difficulty" required>
                            <option value="Легкая">Легкая</option>
                            <option value="Средняя">Средняя</option>
                            <option value="Сложная">Сложная</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Фото блюда</label>
                        <div class="camera-options">
                            <button type="button" class="camera-btn" onclick="openCamera()">📷 Сделать фото</button>

    <script>
        // ========== НАСТРОЙКИ АДМИНИСТРАТОРА ==========
        // 🔐 ИЗМЕНИ ПАРОЛЬ НА СВОЙ!
        const ADMIN_CONFIG = {
            password: 'Admin123456',      // ← ПАРОЛЬ АДМИНА (ИЗМЕНИ НА СВОЙ!)
            email: 'admin@kulinaria.ru',  // Email для обычного входа
            name: '👑 Администратор'
        };
        
        // ========== ИНИЦИАЛИЗАЦИЯ EMAILJS ==========
        const EMAILJS_CONFIG = {
            PUBLIC_KEY: 'YOUR_PUBLIC_KEY',
            SERVICE_ID: 'YOUR_SERVICE_ID',
            TEMPLATE_ID: 'YOUR_TEMPLATE_ID'
        };
        
        emailjs.init(EMAILJS_CONFIG.PUBLIC_KEY);
        
        async function sendRegistrationEmail(user) {
            try {
                const templateParams = {
                    to_email: user.email,
                    to_name: user.name,
                    message: `Добро пожаловать в Кулинарную книгу!`,
                    registration_date: new Date().toLocaleString('ru-RU'),
                    site_name: 'Кулинарная книга'
                };
                await emailjs.send(EMAILJS_CONFIG.SERVICE_ID, EMAILJS_CONFIG.TEMPLATE_ID, templateParams);
                return true;
            } catch (error) {
                console.error('Ошибка отправки email:', error);
                return false;
            }
        }
        
        // ========== ОБЛАЧНАЯ БАЗА ==========
        const API_URL = 'https://script.google.com/macros/s/AKfycbxx1jXs8RHfwYfzZOsPrE6czA49_7LNAL5eKUJSfjwUrrqUbqC4Od_DhROa6W31KVHwWg/exec';
        
        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        let currentPage = 'home';
        let currentSearchQuery = '';
        let recipeToDelete = null;
        let currentRecipeForActions = null;
        let selectedPhotoBase64 = null;
        
        // ========== ФУНКЦИИ АДМИНИСТРАТОРА ==========
        function isUserAdmin(user) {
            if (!user) return false;
            // Проверка по email
            if (user.email === ADMIN_CONFIG.email) return true;
            // Проверка по флагу админа (для виртуального входа)
            if (user.isAdmin === true) return true;
            return false;
        }
        
        // Специальный вход для администратора (только по паролю)
        function adminLogin() {
            const password = prompt('👑 ВВОД ПАРОЛЯ АДМИНИСТРАТОРА 👑\n\nВведите пароль для доступа к админ-панели:');
            
            if (password === ADMIN_CONFIG.password) {
                currentUser = {
                    id: 999999,
                    email: ADMIN_CONFIG.email,
                    name: ADMIN_CONFIG.name,
                    avatar: '👑',
                    isAdmin: true
                };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateUserInterface();
                navigateTo('profile');
                showNotification('✅ Вы вошли как Администратор!', 'success');
            } else if (password) {
                showNotification('❌ Неверный пароль администратора!', 'error');
            }
        }
        
        function getDeleteButton(recipe, isAuthor) {
            if (isUserAdmin(currentUser) || isAuthor) {
                return `<button class="delete-btn" onclick="event.stopPropagation(); showDeleteConfirm(${recipe.id})" title="Удалить рецепт">🗑️</button>`;
            }
            return '';
        }
        
        // ========== РАБОТА С ФОТО ==========
        function openCamera() {
            const input = document.getElementById('photo-file-input');
            input.setAttribute('capture', 'environment');
            input.click();
        }
        
        function uploadFromGallery() {
            const input = document.getElementById('photo-file-input');
            input.removeAttribute('capture');
            input.click();
        }
        
        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                selectedPhotoBase64 = e.target.result;
                document.getElementById('photo-preview-area').innerHTML = `
                    <img src="${selectedPhotoBase64}" class="photo-preview" onclick="uploadFromGallery()">
                    <div class="photo-placeholder" style="width: 40px; height: 40px; font-size: 16px;" onclick="uploadFromGallery()">✖</div>
                `;
                document.getElementById('recipe-image').value = selectedPhotoBase64;
            };
            reader.readAsDataURL(file);
        }
        
        // ========== СКАЧИВАНИЕ И ШАРИНГ ==========
        function downloadRecipe(recipe) {
            const content = generateRecipeText(recipe);
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `${recipe.title.replace(/[^а-яА-Яa-zA-Z0-9]/g, '_')}_рецепт.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showNotification('Рецепт скачан!');
        }
        
        function downloadCurrentRecipe() {
            if (currentRecipeForActions) downloadRecipe(currentRecipeForActions);
        }
        
        function generateRecipeText(recipe) {
            return `
╔══════════════════════════════════════════════════════════════╗
║                    🍳 РЕЦЕПТ: ${recipe.title}                    ║
╚══════════════════════════════════════════════════════════════╝

📋 ОСНОВНАЯ ИНФОРМАЦИЯ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
📁 Категория:      ${recipe.category || 'Не указана'}
⏱️ Время:          ${recipe.total_time || 0} минут
👥 Порции:         ${recipe.servings || 1}
📊 Сложность:      ${recipe.difficulty || 'Средняя'}
🔥 Калорийность:   ${recipe.calorie_count || 'Не указано'} ккал
⭐ Рейтинг:        ${(recipe.rating || 5).toFixed(1)} (${recipe.ratings_count || 0} оценок)
👨‍🍳 Автор:         ${recipe.author_name || 'Аноним'}

🛒 ИНГРЕДИЕНТЫ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${(recipe.ingredients || []).map((ing, i) => `   ${i+1}. ${ing}`).join('\n')}

👩‍🍳 ПРИГОТОВЛЕНИЕ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${(recipe.steps || []).map((step, i) => `   ${i+1}. ${step}`).join('\n\n')}

🏷️ ТЕГИ:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${(recipe.tags || []).join(', ') || 'Нет тегов'}
            `;
        }
        
        function generateShareText(recipe) {
            return `🍳 *${recipe.title}*\n\n📋 ${recipe.category || 'Рецепт'}\n⏱️ ${recipe.total_time || 0} мин\n👥 ${recipe.servings || 1} порц.\n\n🛒 Ингредиенты:\n${(recipe.ingredients || []).map(ing => `• ${ing}`).join('\n')}\n\n👩‍🍳 Приготовление:\n${(recipe.steps || []).map((step, i) => `${i+1}. ${step}`).join('\n')}\n\n⭐ Рейтинг: ${(recipe.rating || 5).toFixed(1)}/5\n\n#рецепт #кулинария`;
        }
        
        async function shareRecipe(recipe) {
            const shareText = generateShareText(recipe);
            if (navigator.share) {
                try {
                    await navigator.share({ title: recipe.title, text: shareText });
                    showNotification('Поделились!');
                } catch (err) {
                    if (err.name !== 'AbortError') copyToClipboard(shareText);
                }
            } else {
                copyToClipboard(shareText);
            }
        }
        
        function shareCurrentRecipe() {
            if (currentRecipeForActions) shareRecipe(currentRecipeForActions);
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showNotification('Рецепт скопирован в буфер обмена!');
            });
        }
        
        // ========== ОБЛАЧНАЯ БД ==========
        const CloudDB = {
            async testConnection() {
                try {
                    const response = await fetch(`${API_URL}?action=test`);
                    const data = await response.json();
                    return data.status === 'ok';
                } catch (error) {
                    return false;
                }
            },
            async register(user) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'register', ...user })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            async login(email, password) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'login', email, password })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            async getRecipes() {
                try {
                    const response = await fetch(`${API_URL}?action=getRecipes`);
                    const data = await response.json();
                    return data.recipes || [];
                } catch (error) {
                    return [];
                }
            },
            async addRecipe(recipe) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'addRecipe', ...recipe })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            async deleteRecipe(recipeId) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'deleteRecipe', recipeId })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            async getRecipe(id) {
                try {
                    const response = await fetch(`${API_URL}?action=getRecipe&id=${id}`);
                    const data = await response.json();
                    return data.recipe || null;
                } catch (error) {
                    return null;
                }
            },
            async rateRecipe(recipeId, userId, rating) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'rateRecipe', recipeId, userId, rating })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            async toggleFavorite(userId, recipeId) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'toggleFavorite', userId, recipeId })
                    });
                    return await response.json();
                } catch (error) {
                    return { success: false, message: 'Ошибка сети' };
                }
            },
            async getFavorites(userId) {
                try {
                    const response = await fetch(`${API_URL}?action=getFavorites&userId=${userId}`);
                    const data = await response.json();
                    return data.favorites || [];
                } catch (error) {
                    return [];
                }
            }
        };
        
        // ========== ЛОКАЛЬНЫЙ КЭШ ==========
        const LocalCache = {
            getRecipes() { return JSON.parse(localStorage.getItem('recipes_cache') || '[]'); },
            getFavorites(userId) {
                const favorites = JSON.parse(localStorage.getItem('favorites_cache') || '{}');
                return favorites[userId] || [];
            },
            saveRecipes(recipes) { localStorage.setItem('recipes_cache', JSON.stringify(recipes)); },
            saveFavorites(userId, favoriteIds) {
                const favorites = JSON.parse(localStorage.getItem('favorites_cache') || '{}');
                favorites[userId] = favoriteIds;
                localStorage.setItem('favorites_cache', JSON.stringify(favorites));
            },
            deleteRecipe(recipeId) {
                const recipes = this.getRecipes();
                this.saveRecipes(recipes.filter(r => r.id != recipeId));
                const favorites = JSON.parse(localStorage.getItem('favorites_cache') || '{}');
                Object.keys(favorites).forEach(userId => {
                    favorites[userId] = favorites[userId].filter(id => id != recipeId);
                });
                localStorage.setItem('favorites_cache', JSON.stringify(favorites));
                return true;
            },
            searchByQuery(query, recipes) {
                if (!query) return recipes;
                const terms = query.toLowerCase().split(/[,\s]+/).filter(t => t.length > 0);
                return recipes.filter(r => {
                    const text = (r.title + ' ' + (r.ingredients || []).join(' ') + ' ' + (r.tags || []).join(' ') + ' ' + (r.category || '')).toLowerCase();
                    return terms.some(t => text.includes(t));
                });
            }
        };
        
        // ========== МЕНЕДЖЕР ДАННЫХ ==========
        const DB = {
            useCloud: false,
            async init() {
                this.useCloud = await CloudDB.testConnection();
                if (this.useCloud) {
                    const recipes = await CloudDB.getRecipes();
                    LocalCache.saveRecipes(recipes);
                }
                return this.useCloud;
            },
            async register(user) {
                if (this.useCloud) return await CloudDB.register(user);
                const users = JSON.parse(localStorage.getItem('users_cache') || '[]');
                if (users.find(u => u.email === user.email)) return { success: false, message: 'Пользователь уже существует' };
                const newUser = { ...user, id: Date.now(), created_at: new Date().toISOString() };
                users.push(newUser);
                localStorage.setItem('users_cache', JSON.stringify(users));
                return { success: true, user: newUser };
            },
            async login(email, password) {
                if (this.useCloud) return await CloudDB.login(email, password);
                const users = JSON.parse(localStorage.getItem('users_cache') || '[]');
                const user = users.find(u => u.email === email && u.password === password);
                if (user) return { success: true, user };
                if (email === 'demo@example.com' && password === 'demo123') {
                    return { success: true, user: { id: 1, email: 'demo@example.com', name: 'Демо Пользователь', avatar: 'Д' } };
                }
                return { success: false, message: 'Неверные данные' };
            },
            async getRecipes() {
                if (this.useCloud) {
                    const cloudRecipes = await CloudDB.getRecipes();
                    if (cloudRecipes.length > 0) {
                        LocalCache.saveRecipes(cloudRecipes);
                        return cloudRecipes;
                    }
                }
                const cached = LocalCache.getRecipes();
                if (cached.length > 0) return cached;
                const demo = [
                    { id: 1, title: "Борщ классический", category: "Супы", total_time: 120, difficulty: "Средняя", servings: 6, calorie_count: 350, rating: 4.8, ratings_count: 24, author_id: 1, author_name: "Демо Пользователь", image_url: "https://images.unsplash.com/photo-1547592180-85f173990554?w=800", ingredients: ["500 г говядины", "2 шт свеклы", "3 картофелины"], steps: ["Варить мясо", "Добавить овощи"], tags: ["русская кухня"] },
                    { id: 2, title: "Омлет с овощами", category: "Завтраки", total_time: 25, difficulty: "Легкая", servings: 2, calorie_count: 250, rating: 4.5, ratings_count: 18, author_id: 1, author_name: "Демо Пользователь", image_url: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800", ingredients: ["4 яйца", "50 мл молока"], steps: ["Взбить яйца", "Обжарить"], tags: ["завтрак"] }
                ];
                LocalCache.saveRecipes(demo);
                return demo;
            },
            async addRecipe(recipe) {
                if (this.useCloud) {
                    const result = await CloudDB.addRecipe(recipe);
                    if (result.success) {
                        const recipes = await this.getRecipes();
                        recipes.push({ ...recipe, id: result.id, rating: 5.0, ratings_count: 1 });
                        LocalCache.saveRecipes(recipes);
                    }
                    return result;
                } else {
                    const recipes = LocalCache.getRecipes();
                    const newRecipe = { ...recipe, id: Date.now(), rating: 5.0, ratings_count: 1 };
                    recipes.push(newRecipe);
                    LocalCache.saveRecipes(recipes);
                    return { success: true, id: newRecipe.id };
                }
            },
            async deleteRecipe(recipeId) {
                if (this.useCloud) {
                    const result = await CloudDB.deleteRecipe(recipeId);
                    if (result.success) LocalCache.deleteRecipe(recipeId);
                    return result;
                } else {
                    LocalCache.deleteRecipe(recipeId);
                    return { success: true };
                }
            },
            async getRecipe(id) {
                const recipes = await this.getRecipes();
                return recipes.find(r => r.id == id) || null;
            },
            async rateRecipe(recipeId, userId, rating) {
                if (this.useCloud) {
                    const result = await CloudDB.rateRecipe(recipeId, userId, rating);
                    if (result.success) {
                        const recipes = await this.getRecipes();
                        const idx = recipes.findIndex(r => r.id == recipeId);
                        if (idx !== -1) {
                            const cur = recipes[idx].rating || 5;
                            const cnt = recipes[idx].ratings_count || 1;
                            recipes[idx].rating = ((cur * cnt) + rating) / (cnt + 1);
                            recipes[idx].ratings_count = cnt + 1;
                            LocalCache.saveRecipes(recipes);
                        }
                    }
                    return result;
                } else {
                    const recipes = LocalCache.getRecipes();
                    const idx = recipes.findIndex(r => r.id == recipeId);
                    if (idx !== -1) {
                        const cur = recipes[idx].rating || 5;
                        const cnt = recipes[idx].ratings_count || 1;
                        recipes[idx].rating = ((cur * cnt) + rating) / (cnt + 1);
                        recipes[idx].ratings_count = cnt + 1;
                        LocalCache.saveRecipes(recipes);
                    }
                    return { success: true };
                }
            },
            async toggleFavorite(userId, recipeId) {
                if (this.useCloud) {
                    const result = await CloudDB.toggleFavorite(userId, recipeId);
                    if (result.success) {
                        const favs = LocalCache.getFavorites(userId);
                        if (result.added) favs.push(recipeId);
                        else favs.splice(favs.indexOf(recipeId), 1);
                        LocalCache.saveFavorites(userId, favs);
                    }
                    return result;
                } else {
                    const favs = LocalCache.getFavorites(userId);
                    const idx = favs.indexOf(recipeId);
                    if (idx === -1) favs.push(recipeId);
                    else favs.splice(idx, 1);
                    LocalCache.saveFavorites(userId, favs);
                    return { success: true, added: idx === -1 };
                }
            },
            async getFavorites(userId) {
                if (this.useCloud) return await CloudDB.getFavorites(userId);
                return LocalCache.getFavorites(userId);
            },
            searchByQuery(query) {
                return LocalCache.searchByQuery(query, LocalCache.getRecipes());
            }
        };
        
        // ========== ОСНОВНЫЕ ФУНКЦИИ ==========
        async function init() {
            await DB.init();
            updateUserInterface();
            navigateTo('home');
            document.getElementById('recipe-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await addRecipe();
            });
            document.querySelectorAll('.modal-overlay').forEach(modal => {
                modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
            });
        }
        
        async function updateUserInterface() {
            const userActions = document.getElementById('user-actions');
            const addRecipeBtn = document.getElementById('add-recipe-btn');
            
            if (currentUser) {
                const favorites = await DB.getFavorites(currentUser.id);
                const isAdmin = isUserAdmin(currentUser);
                userActions.innerHTML = `
                    <div class="user-info">
                        <div class="user-avatar">${currentUser.avatar || currentUser.name.charAt(0)}</div>
                        <span>${currentUser.name} ${isAdmin ? '<span class="admin-badge">👑 АДМИН</span>' : ''}</span>
                    </div>
                    <button class="action-btn" onclick="navigateTo('favorites')">⭐<span class="favorites-count">${favorites.length}</span></button>
                    <button class="action-btn" onclick="logout()">🚪</button>
                `;
                addRecipeBtn.style.display = 'block';
            } else {
                userActions.innerHTML = `
                    <button class="nav-item" onclick="showAuthModal('login')">🔑 Вход</button>
                    <button class="nav-item" onclick="showAuthModal('register')">📝 Регистрация</button>
                    <button class="nav-item" onclick="adminLogin()" style="background: #ff9800; color: #333; padding: 8px 15px; border-radius: 8px;">👑 Админ-вход</button>
                `;
                addRecipeBtn.style.display = 'none';
            }
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                const text = item.textContent.replace('🔑', '').replace('📝', '').replace('👑', '').trim();
                if (text === getNavText(currentPage)) item.classList.add('active');
            });
        }
        
        function getNavText(page) {
            const map = { 'home': 'Главная', 'categories': 'Категории', 'my-recipes': 'Мои рецепты', 'favorites': 'Избранное', 'profile': 'Профиль' };
            return map[page] || 'Главная';
        }
        
        async function navigateTo(page) {
            currentPage = page;
            await updateUserInterface();
            switch(page) {
                case 'home': await showHomePage(); break;
                case 'categories': await showCategoriesPage(); break;
                case 'my-recipes': if (currentUser) await showMyRecipesPage(); else showAuthModal('login'); break;
                case 'favorites': if (currentUser) await showFavoritesPage(); else showAuthModal('login'); break;
                case 'profile': if (currentUser) await showProfilePage(); else showAuthModal('login'); break;
            }
        }
        
        async function showHomePage() {
            const recipes = await DB.getRecipes();
            document.getElementById('main-content').innerHTML = `
                <div class="page-header">
                    <h1 class="page-title">🍳 Добро пожаловать в Кулинарную книгу!</h1>
                    <p class="page-description">${currentUser ? `Рады видеть вас, ${currentUser.name}!` : 'Войдите, чтобы добавлять рецепты'}</p>
                </div>
                <div class="ingredients-search-container">
                    <h3 style="font-family: Playfair Display; margin-bottom: 15px;">🔍 Поиск рецептов</h3>
                    <div class="ingredients-input-container">
                        <input type="text" class="ingredients-input" id="universal-search" placeholder="Поиск по названию или ингредиентам..." onkeypress="if(event.key==='Enter') performUniversalSearch()">
                        <button class="search-btn" onclick="performUniversalSearch()">Найти</button>
                    </div>
                </div>
                <div id="search-results-section"></div>
                <div class="recipes-grid">${(await Promise.all(recipes.slice(0, 6).map(r => renderRecipeCard(r)))).join('')}</div>
            `;
        }
        
        async function performUniversalSearch() {
            const query = document.getElementById('universal-search').value.trim();
            if (!query) { document.getElementById('search-results-section').innerHTML = ''; return; }
            const results = DB.searchByQuery(query);
            const section = document.getElementById('search-results-section');
            if (results.length === 0) {
                section.innerHTML = `<div style="background: var(--light-green); padding: 25px; border-radius: 12px;"><h3>🔍 Результаты: "${query}"</h3><p>Ничего не найдено</p></div>`;
            } else {
                section.innerHTML = `<div style="background: var(--light-green); padding: 25px; border-radius: 12px;"><h3>🔍 Результаты: "${query}"</h3><p>Найдено: ${results.length}</p><div class="recipes-grid">${(await Promise.all(results.map(r => renderRecipeCard(r)))).join('')}</div></div>`;
            }
        }
        
        async function showCategoriesPage() {
            const categories = ['Супы','Основные блюда','Салаты','Десерты','Выпечка','Закуски','Напитки','Завтраки'];
            const recipes = await DB.getRecipes();
            document.getElementById('main-content').innerHTML = `
                <div class="page-header"><h1 class="page-title">📚 Категории</h1></div>
                <div class="categories-grid">${categories.map(cat => {
                    const count = recipes.filter(r => r.category === cat).length;
                    return `<div class="category-card" onclick="showCategory('${cat}')"><div class="category-icon">${getIcon(cat)}</div><div class="category-content"><h3 class="category-title">${cat}</h3><p class="category-count">${count} рецептов</p></div></div>`;
                }).join('')}</div>
            `;
        }
        
        function getIcon(cat) {
            const icons = {'Супы':'🥣','Основные блюда':'🍛','Салаты':'🥗','Десерты':'🍰','Выпечка':'🥐','Закуски':'🍤','Напитки':'🥤','Завтраки':'🍳'};
            return icons[cat] || '🍽️';
        }
        
        async function showCategory(cat) {
            const recipes = await DB.getRecipes();
            const filtered = recipes.filter(r => r.category === cat);
            document.getElementById('main-content').innerHTML = `
                <div class="page-header"><h1 class="page-title">${getIcon(cat)} ${cat}</h1><button onclick="showCategoriesPage()">← Назад</button></div>
                <div class="recipes-grid">${(await Promise.all(filtered.map(r => renderRecipeCard(r)))).join('')}</div>
            `;
        }
        
        async function showMyRecipesPage() {
            if (!currentUser) return;
            const recipes = await DB.getRecipes();
            const my = recipes.filter(r => r.author_id === currentUser.id);
            document.getElementById('main-content').innerHTML = `
                <div class="page-header"><h1 class="page-title">📝 Мои рецепты</h1><p>${my.length} рецептов</p></div>
                ${my.length ? `<div class="recipes-grid">${(await Promise.all(my.map(r => renderRecipeCard(r, true)))).join('')}</div>` : '<div style="text-align:center; padding:40px;"><button onclick="showAddRecipeModal()">+ Добавить первый рецепт</button></div>'}
            `;
        }
        
        async function showFavoritesPage() {
            if (!currentUser) return;
            const favIds = await DB.getFavorites(currentUser.id);
            const recipes = await DB.getRecipes();
            const favs = recipes.filter(r => favIds.includes(r.id));
            document.getElementById('main-content').innerHTML = `
                <div class="page-header"><h1 class="page-title">⭐ Избранное</h1><p>${favs.length} рецептов</p></div>
                ${favs.length ? `<div class="recipes-grid">${(await Promise.all(favs.map(r => renderRecipeCard(r)))).join('')}</div>` : '<div style="text-align:center; padding:40px;">Нет избранных рецептов</div>'}
            `;
        }
        
        async function showProfilePage() {
            if (!currentUser) return;
            const recipes = await DB.getRecipes();
            const myCount = recipes.filter(r => r.author_id === currentUser.id).length;
            const favs = await DB.getFavorites(currentUser.id);
            const isAdmin = isUserAdmin(currentUser);
            
            document.getElementById('main-content').innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar-large">${currentUser.avatar || currentUser.name.charAt(0)}</div>
                    <div class="profile-info">
                        <h1 class="profile-name">${currentUser.name} ${isAdmin ? '👑' : ''}</h1>
                        <p class="profile-email">${currentUser.email}</p>
                        <div class="profile-stats">
                            <div class="profile-stat"><div class="stat-number">${myCount}</div><div class="stat-label">Мои рецепты</div></div>
                            <div class="profile-stat"><div class="stat-number">${favs.length}</div><div class="stat-label">В избранном</div></div>
                        </div>
                    </div>
                </div>
                ${isAdmin ? `
                <div style="background: linear-gradient(135deg, #fff3e0, #ffe0b2); padding: 25px; border-radius: 12px; margin-top: 20px;">
                    <h2 style="color: #e65100;">👑 Админ-панель</h2>
                    <button onclick="showAdminPanel()" style="margin-top: 15px; padding: 12px 24px; background: #e65100; color: white; border: none; border-radius: 8px;">🚀 Управление сайтом</button>
                </div>
                ` : ''}
                <button onclick="logout()" style="margin-top: 30px; padding: 12px 30px; background: none; border: 1px solid #ff6b6b; color: #ff6b6b; border-radius: 8px;">Выйти</button>
            `;
        }
        
        async function showAdminPanel() {
            if (!isUserAdmin(currentUser)) { showNotification('Нет доступа!', 'error'); return; }
            const recipes = await DB.getRecipes();
            document.getElementById('main-content').innerHTML = `
                <div class="page-header"><h1 class="page-title">👑 Админ-панель</h1><button onclick="navigateTo('profile')">← Назад</button></div>
                <div style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                    <h3>📊 Статистика</h3>
                    <p>Всего рецептов: ${recipes.length}</p>
                    <p>Авторов: ${new Set(recipes.map(r => r.author_id)).size}</p>
                </div>
                <h3>📚 Все рецепты</h3>
                <div class="recipes-grid">${(await Promise.all(recipes.map(r => renderAdminRecipeCard(r)))).join('')}</div>
            `;
        }
        
        async function renderAdminRecipeCard(recipe) {
            return `
                <div class="recipe-card" onclick="showRecipeDetail(${recipe.id})">
                    <img src="${recipe.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'}" class="recipe-image">
                    <div class="recipe-content">
                        <div class="recipe-title"><span>${recipe.title}</span></div>
                        <div class="recipe-author"><span>👤 ${recipe.author_name || 'Аноним'}</span></div>
                        <button class="auth-btn-danger" onclick="event.stopPropagation(); adminForceDelete(${recipe.id}, '${recipe.title}')" style="width:100%; margin-top:10px;">🗑️ Удалить (админ)</button>
                    </div>
                </div>
            `;
        }
        
        async function adminForceDelete(id, title) {
            if (confirm(`Удалить рецепт "${title}"?`)) {
                await DB.deleteRecipe(id);
                showNotification('Рецепт удалён');
                showAdminPanel();
            }
        }
        
        async function renderRecipeCard(recipe, isAuthorFlag = false) {
            let isFav = false;
            if (currentUser) {
                const favs = await DB.getFavorites(currentUser.id);
                isFav = favs.includes(recipe.id);
            }
            const isAuthor = currentUser && currentUser.id === recipe.author_id;
            const isAdmin = isUserAdmin(currentUser);
            
            return `
                <div class="recipe-card" onclick="showRecipeDetail(${recipe.id})">
                    <img src="${recipe.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'}" class="recipe-image">
                    <div class="recipe-content">
                        <div class="recipe-title">
                            <span>${recipe.title}</span>
                            <div class="action-buttons-group">
                                <button class="download-btn" onclick="event.stopPropagation(); downloadRecipe(${JSON.stringify(recipe).replace(/"/g, '&quot;')})">📥</button>
                                <button class="share-btn" onclick="event.stopPropagation(); shareRecipe(${JSON.stringify(recipe).replace(/"/g, '&quot;')})">📤</button>
                                ${(isAuthor || isAdmin) ? `<button class="delete-btn" onclick="event.stopPropagation(); showDeleteConfirm(${recipe.id})">🗑️</button>` : ''}
                                <button class="favorite-btn" onclick="event.stopPropagation(); toggleFavorite(${recipe.id})">${isFav ? '★' : '☆'}</button>
                            </div>
                        </div>
                        <div class="rating"><div class="stars">${[1,2,3,4,5].map(s => `<span class="star ${s <= Math.round(recipe.rating || 5) ? 'filled' : ''}" onclick="event.stopPropagation(); rateRecipe(${recipe.id}, ${s})">★</span>`).join('')}</div><span>${(recipe.rating || 5).toFixed(1)}</span></div>
                        <div class="recipe-author"><div class="author-mini">${(recipe.author_name || 'А').charAt(0)}</div><span>${recipe.author_name || 'Аноним'}</span></div>
                        <div class="recipe-meta"><span>⏱ ${recipe.total_time || 0} мин</span><span>👥 ${recipe.servings || 1}</span></div>
                    </div>
                </div>
            `;
        }
        
        async function showRecipeDetail(id) {
            const recipe = await DB.getRecipe(id);
            if (!recipe) return;
            currentRecipeForActions = recipe;
            let isFav = false;
            if (currentUser) {
                const favs = await DB.getFavorites(currentUser.id);
                isFav = favs.includes(recipe.id);
            }
            const isAuthor = currentUser && currentUser.id === recipe.author_id;
            const isAdmin = isUserAdmin(currentUser);
            
            document.getElementById('modal-recipe-title').innerHTML = recipe.title;
            document.getElementById('recipe-modal-content').innerHTML = `
                <div style="display:flex; gap:20px; flex-wrap:wrap;">
                    <img src="${recipe.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800'}" style="width:300px; height:200px; object-fit:cover; border-radius:12px;">
                    <div style="flex:1">
                        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:20px;">
                            <div style="background:var(--light-green); padding:10px; border-radius:8px;"><b>${recipe.total_time || 0} мин</b><br>Время</div>
                            <div style="background:var(--light-green); padding:10px; border-radius:8px;"><b>${recipe.servings || 1}</b><br>Порции</div>
                            <div style="background:var(--light-green); padding:10px; border-radius:8px;"><b>${recipe.difficulty || 'Средняя'}</b><br>Сложность</div>
                            ${recipe.calorie_count ? `<div style="background:var(--light-green); padding:10px; border-radius:8px;"><b>${recipe.calorie_count}</b><br>ккал</div>` : ''}
                        </div>
                        <div class="rating"><div class="stars">${[1,2,3,4,5].map(s => `<span class="star ${s <= Math.round(recipe.rating || 5) ? 'filled' : ''}" onclick="rateRecipe(${recipe.id}, ${s})">★</span>`).join('')}</div><span>${(recipe.rating || 5).toFixed(1)} (${recipe.ratings_count || 0} оценок)</span></div>
                        ${currentUser ? `<div style="margin-top:15px;"><button onclick="toggleFavorite(${recipe.id})" style="padding:10px 20px; background:${isFav ? 'var(--light-green)' : 'var(--accent-green)'}; border:none; border-radius:8px;">${isFav ? '★ В избранном' : '☆ В избранное'}</button> ${(isAuthor || isAdmin) ? `<button onclick="showDeleteConfirm(${recipe.id})" style="padding:10px 20px; background:var(--danger); border:none; border-radius:8px; color:white;">🗑️ Удалить</button>` : ''}</div>` : ''}
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:30px;">
                    <div><h3>🧺 Ингредиенты</h3><ul>${(recipe.ingredients || []).map(i => `<li>${i}</li>`).join('')}</ul></div>
                    <div><h3>👩‍🍳 Приготовление</h3><ol>${(recipe.steps || []).map((s,i) => `<li><b>Шаг ${i+1}:</b> ${s}</li>`).join('')}</ol></div>
                </div>
            `;
            document.getElementById('recipe-modal').classList.add('active');
        }
        
        async function rateRecipe(id, rating) {
            if (!currentUser) { showAuthModal('login'); return; }
            await DB.rateRecipe(id, currentUser.id, rating);
            showNotification(`Оценено на ${rating} ⭐`);
            await navigateTo(currentPage);
        }
        
        async function toggleFavorite(id) {
            if (!currentUser) { showAuthModal('login'); return; }
            const result = await DB.toggleFavorite(currentUser.id, id);
            showNotification(result.added ? 'В избранное' : 'Из избранного');
            await navigateTo(currentPage);
            await updateUserInterface();
        }
        
        function showDeleteConfirm(id) { recipeToDelete = id; document.getElementById('confirm-delete-modal').classList.add('active'); }
        function closeConfirmDeleteModal() { document.getElementById('confirm-delete-modal').classList.remove('active'); recipeToDelete = null; }
        async function confirmDeleteRecipe() { if (recipeToDelete) { await DB.deleteRecipe(recipeToDelete); showNotification('Удалено'); closeConfirmDeleteModal(); await navigateTo(currentPage); } }
        function closeRecipeModal() { document.getElementById('recipe-modal').classList.remove('active'); currentRecipeForActions = null; }
        
        function showAuthModal(type) {
            const modal = document.getElementById('auth-modal');
            document.getElementById('auth-modal-title').innerText = type === 'login' ? 'Вход' : 'Регистрация';
            document.getElementById('auth-form-container').innerHTML = `
                <form id="${type}-form" class="auth-form">
                    ${type === 'register' ? `<div class="form-group"><label>Имя</label><input type="text" class="form-input" id="reg-name" required></div>` : ''}
                    <div class="form-group"><label>Email</label><input type="email" class="form-input" id="${type}-email" required></div>
                    <div class="form-group"><label>Пароль</label><input type="password" class="form-input" id="${type}-pass" required></div>
                    <button type="submit" class="auth-btn">${type === 'login' ? 'Войти' : 'Зарегистрироваться'}</button>
                </form>
                <div class="auth-switch">${type === 'login' ? 'Нет аккаунта? <a onclick="showAuthModal(\'register\')">Регистрация</a>' : 'Уже есть аккаунт? <a onclick="showAuthModal(\'login\')">Вход</a>'}</div>
            `;
            document.getElementById(`${type}-form`).addEventListener('submit', async (e) => {
                e.preventDefault();
                if (type === 'login') await login();
                else await register();
            });
            modal.classList.add('active');
        }
        
        function closeAuthModal() { document.getElementById('auth-modal').classList.remove('active'); }
        
        async function register() {
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const pass = document.getElementById('register-pass').value;
            const res = await DB.register({ name, email, password: pass, avatar: name.charAt(0) });
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                closeAuthModal();
                await updateUserInterface();
                await navigateTo('home');
                showNotification(`Добро пожаловать, ${name}!`);
            } else showNotification(res.message || 'Ошибка', 'error');
        }
        
        async function login() {
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-pass').value;
            const res = await DB.login(email, pass);
            if (res.success) {
                currentUser = res.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                closeAuthModal();
                await updateUserInterface();
                await navigateTo('home');
                showNotification(`С возвращением, ${currentUser.name}!`);
            } else showNotification(res.message || 'Ошибка', 'error');
        }
        
        async function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            await updateUserInterface();
            await navigateTo('home');
            showNotification('Вы вышли');
        }
        
        function showAddRecipeModal() {
            if (!currentUser) { showAuthModal('login'); return; }
            selectedPhotoBase64 = null;
            document.getElementById('photo-preview-area').innerHTML = '<div class="photo-placeholder" onclick="uploadFromGallery()">+</div>';
            document.getElementById('recipe-image').value = '';
            document.getElementById('add-recipe-modal').classList.add('active');
        }
        
        function closeAddRecipeModal() {
            document.getElementById('add-recipe-modal').classList.remove('active');
            document.getElementById('recipe-form').reset();
        }
        
        async function addRecipe() {
            if (!currentUser) return;
            const title = document.getElementById('recipe-title').value.trim();
            const category = document.getElementById('recipe-category').value;
            const time = parseInt(document.getElementById('recipe-time').value);
            const servings = parseInt(document.getElementById('recipe-servings').value);
            const difficulty = document.getElementById('recipe-difficulty').value;
            const cal = parseInt(document.getElementById('recipe-calorie_count').value);
            const ingredients = document.getElementById('recipe-ingredients').value.split('\n').filter(i => i.trim());
            const steps = document.getElementById('recipe-steps').value.split('\n').filter(s => s.trim());
            const tags = document.getElementById('recipe-tags').value.split(',').map(t => t.trim());
            const image = selectedPhotoBase64 || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800';
            const recipe = { title, category, total_time: time, difficulty, servings, calorie_count: cal, ingredients, steps, tags, author_id: currentUser.id, author_name: currentUser.name, image_url: image };
            const res = await DB.addRecipe(recipe);
            if (res.success) {
                closeAddRecipeModal();
                showNotification('Рецепт добавлен!');
                await navigateTo('my-recipes');
            }
        }
        
        function showNotification(msg, type = 'success') {
            const n = document.createElement('div');
            n.style.cssText = `position:fixed; bottom:20px; right:20px; background:${type === 'error' ? '#ff6b6b' : '#7cb342'}; color:white; padding:15px 25px; border-radius:8px; z-index:10001; animation:slideIn 0.3s ease;`;
            n.textContent = msg;
            document.body.appendChild(n);
            setTimeout(() => { n.style.animation = 'slideOut 0.3s ease'; setTimeout(() => n.remove(), 300); }, 3000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active')); });
            init();
        });
    </script>
</body>
</html>
